<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dojrzałość HR i kompetencje HR · test</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--navy:#1F4460;--honey:#E8B62C;--onh:#5C4810;--tag:#FDF4DC;--info:#F0F6FB;--line:#D5DDE5;--mut:#5E6B78;--ink:#1B2733;--bg:#F5F5F7;--red:#B3261E}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Montserrat,'Segoe UI',Arial,sans-serif;color:var(--ink);font-size:17px;line-height:1.5}
.nag{background:#fff;border-bottom:2px solid var(--line);padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.zml{display:flex;align-items:center;gap:8px;color:var(--navy)}.zml svg{height:30px;width:auto}.zml b{font-size:16px;font-weight:800;letter-spacing:.02em}
.merito{height:44px;width:auto}
main{max-width:900px;margin:0 auto;padding:24px 16px 40px}
h1{color:var(--navy);font-size:30px;line-height:1.15;margin:8px 0 12px}h2{color:var(--navy);font-size:22px;line-height:1.25;margin:0 0 10px}h3{color:var(--navy);font-size:18px;margin:14px 0 6px}
p{margin:0 0 10px}.mut{color:var(--mut)}.lead{font-size:18px}
.karta{background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px 20px;margin:14px 0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;background:var(--navy);color:#fff;border:none;border-radius:12px;font:inherit;font-weight:700;font-size:18px;min-height:56px;cursor:pointer;margin-top:12px;padding:8px 16px;text-align:center}
.btn:disabled{background:#9AA7B3;cursor:default}
.badania{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bad{background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px 20px;display:flex;flex-direction:column}
.bad .nr{font-weight:800;color:var(--onh);background:var(--tag);border-radius:999px;padding:2px 10px;align-self:flex-start;font-size:14px}
.bad h2{margin-top:10px}.bad p{flex:1}.bad .st{font-weight:700;color:var(--navy);font-size:15px}
.bad.zrob{border-color:var(--navy)}
.konf{border-color:var(--honey);background:#FFFBEF}
.pasek{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:2}
.pasek .t{display:flex;justify-content:space-between;font-weight:700;color:var(--navy);font-size:15px;margin-bottom:6px}
.pasek .p{height:10px;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}.pasek .p i{display:block;height:100%;background:var(--honey);width:0;transition:width .3s}
.grh{margin:26px 0 6px;padding:12px 16px;background:var(--navy);color:#fff;border-radius:12px}.grh b{display:block;font-size:19px}.grh span{font-size:15px;color:#DCE6EF}
.pyt{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0}.pyt.ok{border-color:var(--navy)}
.pyt .q{font-weight:800;color:var(--navy)}.pyt .qo{color:var(--mut);font-size:15px;margin:2px 0 10px}
.pyt .qz{font-weight:700;margin-bottom:10px}.pyt .qz small{color:var(--mut);margin-right:6px}
.opc button{display:block;width:100%;text-align:left;font:inherit;font-size:15px;font-weight:500;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;line-height:1.4}
.opc button.on{border-color:var(--navy);background:#E8EEF3;color:var(--navy);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg button{font:inherit;font-size:14px;font-weight:700;border:2px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;min-height:46px;padding:4px 2px;cursor:pointer}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.wyn{background:var(--navy);color:#fff;border-radius:16px;padding:20px;margin:14px 0}.wyn h2{color:var(--honey)}.wyn p{color:#DCE6EF}
.duzy{font-size:40px;font-weight:800;color:var(--honey);line-height:1.1}
.kl{display:inline-flex;gap:4px;vertical-align:middle}.kl i{width:22px;height:14px;border-radius:4px;background:#E3E8ED}.kl i.on{background:var(--honey)}
.wyn .kl i{background:rgba(255,255,255,.2)}.wyn .kl i.on{background:var(--honey)}
.mapa{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.mapa .g{grid-column:1/-1;font-weight:800;color:var(--navy);margin-top:10px;border-bottom:2px solid var(--line);padding-bottom:4px;display:flex;justify-content:space-between}
.mapa span{font-size:16px}.mapa .lv{font-weight:700;font-size:14px;color:var(--mut);min-width:180px;text-align:right}
.st-ok{color:var(--navy)}.st-cz{color:var(--onh)}.st-no{color:var(--red)}
.pfw{border-left:5px solid var(--line);padding:8px 12px;margin:10px 0;background:#fff;border-radius:0 10px 10px 0}
.pfw.n0{border-color:var(--red)}.pfw.n1,.pfw.n2{border-color:var(--honey)}.pfw.n3,.pfw.n4{border-color:var(--navy)}
.pfw b{color:var(--navy)}.pfw .r{font-size:15px;margin-top:4px}.pfw .r em{font-style:normal;font-weight:700;color:var(--mut);display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.ost{background:var(--tag);border:2px solid var(--honey);border-radius:12px;padding:12px 14px;margin:10px 0}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kp div{background:var(--info);border-radius:12px;padding:10px 12px;font-size:15px}.kp b{color:var(--navy);display:block}
.lista{list-style:none;padding:0;margin:6px 0}.lista li{background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.lista li.s-mocna{border-color:var(--navy)}.lista li.s-brak{border-color:var(--red)}.lista li.s-rozw{border-color:var(--honey)}
.lista li b{color:var(--navy)}.lista .tg{float:right;font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:var(--tag);color:var(--onh)}
.lista li.s-mocna .tg{background:var(--navy);color:#fff}.lista li.s-brak .tg{background:#FBE9E7;color:var(--red)}
.lista .r{font-size:15px;margin-top:4px}.lista .r em{font-style:normal;font-weight:700;color:var(--mut)}
.kf{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start;border-top:2px solid var(--line);padding:12px 0}
.kf .lp{font-weight:800;color:var(--navy)}.kf .lp small{display:block;color:var(--mut);font-weight:600;font-size:13px}
.kf .typ{font-weight:800;margin-bottom:4px}.t-wsp{color:var(--navy)}.t-luka{color:var(--red)}.t-pot{color:var(--onh)}.t-nast{color:var(--mut)}
.dz{counter-reset:d;list-style:none;padding:0}.dz li{counter-increment:d;background:#fff;border:2px solid var(--honey);border-radius:12px;padding:12px 14px 12px 52px;margin:10px 0;position:relative}
.dz li:before{content:counter(d);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--honey);color:var(--onh);font-weight:800;display:flex;align-items:center;justify-content:center}
.dz li b{color:var(--navy);display:block}
.wroc{background:none;border:none;color:var(--navy);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:0;margin:6px 0}
.stopka{text-align:center;color:var(--mut);font-size:13px;margin:10px 0 30px}
@media(max-width:640px){h1{font-size:24px}.badania,.kp{grid-template-columns:1fr}.seg button{font-size:12px}.merito{height:34px}.mapa{grid-template-columns:1fr}.mapa .lv{text-align:left;min-width:0}.kf{grid-template-columns:1fr}}
@media print{.pasek,.btn,.wroc,.nag{display:none!important}body{background:#fff}.wyn,.grh{-webkit-print-color-adjust:exact;print-color-adjust:exact}.karta,.pfw,.lista li{break-inside:avoid}}
.mapa .lv.st-no{color:var(--red)}.mapa .lv.st-ok{color:var(--navy)}
</style></head><body>

<div class="stopka">dr Marcin Żółtak · ZMIANOLOGICA · Uniwersytet WSB Merito Poznań</div>
<script>const D={"grupy": [{"id": "mie", "n": "Mieć ludzi", "o": "Czy organizacja ma ludzi, których potrzebuje: pozyskuje ich, zatrudnia zgodnie z prawem, rozstaje się z nimi w uporządkowany sposób i świadomie korzysta z usług zewnętrznych.", "s": "Gdy ta grupa jest słaba, organizacja zatrudnia z opóźnieniem, popełnia błędy formalne i nie wie, dlaczego ludzie odchodzą."}, {"id": "pot", "n": "Żeby potrafili", "o": "Czy ludzie potrafią wykonywać pracę: szybko się wdrażają, rozwijają potrzebne kompetencje, mają następców, a kierownicy umieją zarządzać zespołami.", "s": "Gdy ta grupa jest słaba, nowe osoby długo dochodzą do samodzielności, a odejście kluczowej osoby zatrzymuje pracę działu."}, {"id": "chc", "n": "Żeby chcieli", "o": "Czy ludzie chcą pracować w organizacji i w niej zostać: płace są zrozumiałe i sprawiedliwe, informacje docierają, warunki są bezpieczne, a spory są rozwiązywane.", "s": "Gdy ta grupa jest słaba, rośnie rotacja i absencja, a pracownicy dowiadują się o zmianach z nieoficjalnych źródeł."}, {"id": "org", "n": "Organizować i kierować", "o": "Czy HR jest zorganizowany i kierowany: planuje ludzi, opiera się na danych, prowadzi zmiany i upraszcza swoje procesy.", "s": "Gdy ta grupa jest słaba, HR sprawnie załatwia bieżące sprawy, ale nie wie, czego organizacja będzie potrzebować za rok lub dwa."}], "pf": [{"g": "mie", "n": "Rekrutacja i selekcja", "o": "Znajduje kandydatów i wybiera osoby, które spełniają wymagania stanowiska.", "l": ["Zatrudniamy dopiero, gdy ktoś odejdzie. Ogłoszenie i rozmowy prowadzi ten, kto ma czas.", "Rekrutacja przebiega według opisanego procesu z ustalonymi etapami i terminami.", "HR i kierownik wspólnie ustalają profil stanowiska i wspólnie oceniają kandydatów.", "Zatrudnienie wynika z planu ludzi opartego na strategii firmy na najbliższe lata."], "k": ["Ustalić, kto w firmie odpowiada za zatrudnianie i jakie dokumenty muszą być gotowe przed pierwszym dniem pracy.", "Opisać etapy rekrutacji, ich kolejność i terminy oraz stosować je w każdym dziale.", "Przed każdą rekrutacją ustalać z kierownikiem profil stanowiska i kryteria oceny kandydatów.", "Przygotować z zarządem plan zatrudnienia na najbliższe lata, wynikający ze strategii."]}, {"g": "mie", "n": "Employer branding", "o": "Buduje opinię o firmie jako pracodawcy, żeby odpowiedni kandydaci chcieli się zgłaszać.", "l": ["Ogłoszenia opisują tylko stanowisko i wymagania. Firma nie zajmuje się swoim wizerunkiem jako pracodawcy.", "Ogłoszenia i oferty pracy mają jednolity wzór i opisują, co firma oferuje pracownikom.", "HR wie, skąd przychodzą dobrzy kandydaci, i dopasowuje przekaz do grup, których firma szuka.", "Wizerunek pracodawcy jest planowany pod grupy pracowników, których strategia będzie wymagać."], "k": ["Opisywać w ogłoszeniach nie tylko wymagania, ale też warunki pracy.", "Ustalić jeden wzór ogłoszeń i jedno miejsce publikowania ofert pracy.", "Pytać nowych pracowników, skąd dowiedzieli się o firmie i dlaczego aplikowali.", "Ustalić z zarządem, jakich pracowników firma będzie potrzebować za kilka lat, i do nich kierować przekaz."]}, {"g": "mie", "n": "Administracja kadrowo-płacowa", "o": "Prowadzi dokumentację, czas pracy i wynagrodzenia zgodnie z prawem.", "l": ["Akta, umowy i płace są prowadzone zgodnie z przepisami.", "Obsługa kadrowo-płacowa ma opisane procedury i terminy i działa w jednym systemie kadrowym.", "Kierownicy dostają z kadr dane o swoich zespołach, na przykład o urlopach i nadgodzinach.", "Koszty pracy i dane kadrowe są wykorzystywane w planowaniu budżetu i w decyzjach zarządu."], "k": ["Uporządkować akta osobowe i sprawdzić zgodność umów z przepisami.", "Spisać procedury i terminy obsługi kadrowo-płacowej i przenieść dane do jednego systemu.", "Ustalić z kierownikami, jakie dane o ich zespołach mają dostawać i jak często.", "Przygotować dla zarządu zestawienie kosztów pracy powiązane z budżetem."]}, {"g": "mie", "n": "Odejścia", "o": "Prowadzi rozstania z pracownikami i bada przyczyny odejść.", "l": ["Rozstania są załatwiane formalnie: wypowiedzenie, świadectwo pracy, rozliczenie.", "Rozstanie przebiega według opisanej procedury, z rozmową końcową i przekazaniem obowiązków.", "HR analizuje przyczyny odejść i omawia je z kierownikami działów.", "Firma wie, które odejścia zagrażają jej planom, i z wyprzedzeniem im zapobiega."], "k": ["Spisać formalności przy rozstaniu i ustalić, kto za nie odpowiada.", "Wprowadzić rozmowę końcową i listę przekazania obowiązków dla każdej odchodzącej osoby.", "Zbierać przyczyny odejść i co kwartał omawiać je z kierownikami.", "Wskazać stanowiska, których utrata zagroziłaby planom firmy, i zaplanować działania zatrzymujące."]}, {"g": "mie", "n": "Dostawcy usług HR", "o": "Wybiera firmy zewnętrzne, którym zlecamy zadania HR, i kontroluje jakość ich pracy.", "l": ["Firma korzysta z usług zewnętrznych doraźnie, bez umów określających jakość.", "Usługi zewnętrzne mają umowy z zakresem, terminami i miernikami jakości.", "HR wybiera dostawców razem z kierownikami, którzy korzystają z usług, i wspólnie z nimi ocenia ich pracę.", "Decyzja, które zadania HR firma wykonuje sama, a które zleca, wynika ze strategii i kosztów."], "k": ["Spisać, jakie usługi HR firma kupuje i od kogo.", "Wpisać do umów z dostawcami zakres, terminy i mierniki jakości.", "Raz w roku oceniać dostawców razem z kierownikami, którzy z nich korzystają.", "Przejrzeć z zarządem, które zadania HR firma powinna wykonywać sama, a które zlecać."]}, {"g": "pot", "n": "Wdrożenie", "o": "Przygotowuje nową osobę do samodzielnej pracy w zespole.", "l": ["Nowa osoba dostaje szkolenie BHP i dokumenty, a resztę poznaje sama.", "Każda nowa osoba przechodzi ten sam program wdrożenia z opiekunem i listą kontrolną.", "Program wdrożenia jest dopasowany do stanowiska, a kierownik z HR sprawdza po kilku tygodniach, czy nowa osoba pracuje samodzielnie.", "Wdrożenia są planowane razem z planem zatrudnienia i przygotowują ludzi do zadań wynikających ze strategii."], "k": ["Ustalić, co nowa osoba musi dostać i wiedzieć pierwszego dnia.", "Opisać jeden program wdrożenia z opiekunem i listą kontrolną pierwszego miesiąca.", "Dopasować program do grup stanowisk i sprawdzać po miesiącu, czy nowa osoba pracuje samodzielnie.", "Planować wdrożenia razem z planem zatrudnienia na najbliższe lata."]}, {"g": "pot", "n": "Ocena i rozwój kompetencji", "o": "Ocenia, co ludzie umieją, i planuje szkolenia oraz rozwój.", "l": ["Szkolenia obowiązkowe, takie jak BHP i uprawnienia, są aktualne i udokumentowane.", "Ocena okresowa odbywa się regularnie, według jednego formularza i harmonogramu.", "Po ocenie kierownik ustala z pracownikiem plan rozwoju, a HR pomaga go zrealizować.", "Organizacja rozwija kompetencje, których będzie potrzebować do realizacji strategii."], "k": ["Sporządzić wykaz szkoleń obowiązkowych i terminów ich odnowienia.", "Wprowadzić regularną ocenę okresową z jednym formularzem i harmonogramem.", "Po każdej ocenie ustalać z pracownikiem plan rozwoju i sprawdzać jego realizację.", "Ustalić z zarządem, jakich kompetencji firma będzie potrzebować, i na nich oprzeć plan rozwoju."]}, {"g": "pot", "n": "Talenty i sukcesja", "o": "Wskazuje osoby z potencjałem i przygotowuje następców na kluczowe stanowiska.", "l": ["Zastępstwa na kluczowych stanowiskach ustala się doraźnie, gdy ktoś odchodzi lub choruje.", "Istnieje lista kluczowych stanowisk i osób, które mogłyby je przejąć.", "Kierownicy z HR wskazują osoby z potencjałem i przygotowują je do nowych ról.", "Plan sukcesji obejmuje stanowiska ważne dla strategii i jest regularnie przeglądany przez zarząd."], "k": ["Ustalić, kto zastępuje osoby na kluczowych stanowiskach podczas ich nieobecności.", "Sporządzić listę kluczowych stanowisk i możliwych następców.", "Wskazać z kierownikami osoby z potencjałem i przygotować dla nich plan rozwoju.", "Raz w roku omawiać z zarządem plan sukcesji dla stanowisk ważnych dla strategii."]}, {"g": "pot", "n": "Wsparcie kierowników", "o": "Doradza kierownikom w sprawach ludzi: konfliktach, ocenie, motywowaniu.", "l": ["Kierownik zwraca się do HR w sprawach formalnych: umowy, urlopy, dokumenty.", "Kierownicy mają opisane, co należy do nich, a co do HR w rekrutacji, ocenie i rozstaniach.", "Kierownicy przychodzą do HR po radę w trudnych sprawach ze swoimi zespołami.", "HR i kierownicy razem przygotowują zespoły do zmian w organizacji."], "k": ["Wskazać kierownikom osobę w HR, do której zwracają się w sprawach kadrowych.", "Spisać podział zadań między kierownika a HR w głównych procesach.", "Prowadzić regularne rozmowy z kierownikami o problemach w ich zespołach.", "Włączać HR w przygotowanie zmian w działach od samego początku."]}, {"g": "chc", "n": "Wynagradzanie i motywowanie", "o": "Ustala, za co i ile płacimy, oraz jak doceniamy pracę.", "l": ["Wynagrodzenia są naliczane i wypłacane na czas i bez błędów.", "Zasady płac, premii i dodatków są spisane i znane pracownikom.", "HR porównuje płace z rynkiem i doradza kierownikom, jak doceniać ludzi.", "System wynagradzania nagradza zachowania i wyniki, których wymaga strategia."], "k": ["Sprawdzić terminowość i poprawność wypłat.", "Spisać i ogłosić zasady płac, premii i dodatków.", "Porównać płace z rynkiem i przygotować dla kierowników zasady doceniania pracowników.", "Powiązać premie z celami wynikającymi ze strategii."]}, {"g": "chc", "n": "Komunikacja wewnętrzna", "o": "Dba, żeby ludzie wiedzieli, co się dzieje w firmie i dlaczego.", "l": ["Regulaminy i ogłoszenia formalne są dostępne dla pracowników.", "Firma ma ustalone kanały i terminy przekazywania informacji.", "HR sprawdza, czy pracownicy rozumieją zmiany, i zbiera ich pytania.", "Pracownicy znają strategię i wiedzą, co z niej wynika dla ich pracy."], "k": ["Zebrać regulaminy i ważne informacje w jednym miejscu dostępnym dla wszystkich.", "Ustalić kanały i terminy przekazywania informacji.", "Po ważnych zmianach pytać pracowników, co zrozumieli i co budzi wątpliwości.", "Wyjaśniać pracownikom strategię i jej skutki dla ich działów."]}, {"g": "chc", "n": "BHP i warunki pracy", "o": "Dba o bezpieczeństwo i warunki, w jakich ludzie pracują.", "l": ["Szkolenia i badania BHP są aktualne, a dokumenty zgodne z przepisami.", "Ocena ryzyka i działania BHP są prowadzone według rocznego planu.", "HR i kierownicy analizują wypadki i absencję i wspólnie poprawiają warunki pracy.", "Warunki pracy są planowane razem z rozwojem firmy, na przykład przy nowych liniach produkcyjnych czy biurach."], "k": ["Sprawdzić aktualność szkoleń, badań i oceny ryzyka.", "Przygotować roczny plan działań BHP.", "Omawiać z kierownikami przyczyny wypadków i absencji w ich działach.", "Włączać BHP i HR w planowanie inwestycji i zmian w organizacji pracy."]}, {"g": "chc", "n": "Relacje pracownicze", "o": "Prowadzi rozmowy z przedstawicielami pracowników i rozwiązuje spory.", "l": ["Firma spełnia obowiązki prawne wobec przedstawicieli pracowników.", "Spotkania z przedstawicielami pracowników odbywają się regularnie, według ustalonego trybu.", "HR zajmuje się sporami na wczesnym etapie, zanim staną się konfliktami.", "Zarząd konsultuje z pracownikami ważne zmiany, zanim zapadną decyzje."], "k": ["Sprawdzić, jakie obowiązki informacyjne i konsultacyjne ma firma wobec pracowników.", "Ustalić stały tryb i terminy spotkań z przedstawicielami pracowników.", "Ustalić, jak pracownik zgłasza spór i kto zajmuje się nim w HR.", "Konsultować z przedstawicielami pracowników plany zmian przed decyzją."]}, {"g": "org", "n": "Planowanie zasobów ludzkich", "o": "Przewiduje, ilu i jakich ludzi organizacja będzie potrzebować.", "l": ["Zatrudnienie planuje się na bieżąco, gdy pojawia się wakat.", "Raz w roku powstaje plan zatrudnienia na podstawie wniosków działów.", "HR z kierownikami analizuje, ilu i jakich ludzi działy będą potrzebować.", "Plan ludzi wynika ze strategii i obejmuje kilka lat."], "k": ["Prowadzić aktualny wykaz etatów i wakatów.", "Raz w roku zbierać od działów plan zatrudnienia.", "Analizować z kierownikami przyszłe potrzeby działów: liczbę ludzi i potrzebne kompetencje.", "Przygotować z zarządem wieloletni plan ludzi oparty na strategii."]}, {"g": "org", "n": "Kultura i zarządzanie zmianą", "o": "Wspiera zachowania, których wymaga strategia, i prowadzi ludzi przez zmiany.", "l": ["Pracownicy dowiadują się o zmianach po podjęciu decyzji.", "Przy zmianach powstaje plan komunikacji i szkoleń.", "HR pomaga kierownikom przygotować zespoły do zmian i rozmawiać o nich z ludźmi.", "HR wskazuje zarządowi, które codzienne zachowania wspierają strategię, a które jej przeszkadzają, i prowadzi zmiany w całej organizacji."], "k": ["Informować pracowników o zmianach, które ich dotyczą, i wyjaśniać powody.", "Przy każdej większej zmianie przygotować plan komunikacji i szkoleń.", "Przygotować kierowników do rozmów o zmianach ze swoimi zespołami.", "Opisać z zarządem zachowania, których wymaga strategia, i porównać je z obecnymi."]}, {"g": "org", "n": "Analityka HR", "o": "Zbiera dane o ludziach i pokazuje zarządowi, co z nich wynika.", "l": ["Dane kadrowe są aktualne i zgodne z dokumentami.", "HR regularnie liczy podstawowe wskaźniki: rotację, absencję i czas zatrudnienia.", "HR pokazuje kierownikom dane o ich działach i omawia, co z nich wynika.", "Dane o ludziach są łączone z wynikami firmy i wykorzystywane w decyzjach zarządu."], "k": ["Uporządkować dane kadrowe w jednym systemie.", "Co miesiąc liczyć rotację, absencję i czas zatrudnienia.", "Co kwartał omawiać z kierownikami dane z ich działów.", "Przygotować dla zarządu raport łączący dane o ludziach z wynikami firmy."]}, {"g": "org", "n": "Doskonalenie procesów HR", "o": "Upraszcza procesy HR dla tych, którzy z nich korzystają.", "l": ["Procesy HR zmieniają się dopiero wtedy, gdy pojawi się problem albo zmienią się przepisy.", "Procesy HR są opisane i okresowo przeglądane.", "HR pyta kierowników i pracowników, co w procesach utrudnia im pracę, i upraszcza te procesy.", "Procesy HR są przebudowywane z wyprzedzeniem, gdy wymaga tego strategia, na przykład przy wzroście firmy lub automatyzacji."], "k": ["Spisać najczęstsze problemy w procesach HR.", "Opisać główne procesy HR i ustalić termin ich przeglądu.", "Pytać kierowników i pracowników, co w procesach HR im przeszkadza.", "Sprawdzać, jak plany firmy zmienią procesy HR, i przygotowywać je z wyprzedzeniem."]}, {"g": "org", "n": "Organizacja funkcji HR", "o": "Ustala, jak zorganizować HR: strukturę, role i podział zadań.", "l": ["Zadania HR wykonuje jedna osoba w kadrach albo kilka osób przy okazji innych obowiązków.", "Dział HR ma opisane zadania, role i podział pracy.", "Struktura HR jest dopasowana do działów, na przykład konkretne osoby z HR opiekują się konkretnymi działami.", "Struktura i role HR wynikają ze strategii i zmieniają się razem z organizacją."], "k": ["Wskazać osobę odpowiedzialną za sprawy kadrowe.", "Opisać zadania i role w HR.", "Przypisać osoby z HR do działów i ustalić zasady współpracy.", "Ustalić z zarządem, jakiej struktury HR firma będzie potrzebować za kilka lat."]}], "poz": {"0": {"naz": "Poniżej poziomu 1", "jak": "Część podstawowych zadań HR nie jest wykonywana w uporządkowany sposób albo nikt za nie nie odpowiada.", "mocne": "Na tym etapie trudno mówić o mocnych stronach całego HR. Mogą je mieć pojedyncze podfunkcje, które widać w profilu.", "problemy": "Organizacja jest narażona na błędy prawne, opóźnienia w płacach i dokumentach oraz na zależność od pojedynczych osób.", "sygnal": "Pojawiają się błędy w umowach lub wypłatach, a pracownicy nie wiedzą, do kogo zwrócić się w sprawach kadrowych.", "krok": "Zapewnić zgodność z prawem i terminowość spraw kadrowo-płacowych oraz wskazać osobę za nie odpowiedzialną."}, "1": {"naz": "Administracyjny", "jak": "HR dba o dokumenty, płace i zgodność z prawem. Kierownicy zarządzają ludźmi sami, a HR załatwia formalności.", "mocne": "Płace są wypłacane na czas, dokumenty są w porządku, a organizacja jest bezpieczna pod względem prawnym.", "problemy": "Każdy dział rekrutuje i wdraża inaczej, błędy się powtarzają, a wiedza zależy od pojedynczych osób.", "sygnal": "Organizacja rośnie i HR nie nadąża: powtarzają się błędy w dokumentach, każdy nowy pracownik jest wdrażany inaczej.", "krok": "Opisać i ujednolicić jeden proces, na przykład wdrożenie, i stosować go w całej firmie."}, "2": {"naz": "Procesowy", "jak": "HR prowadzi cały cykl życia pracownika według opisanych procesów, takich samych w całej firmie.", "mocne": "Pracownicy są traktowani jednakowo, procesy są przewidywalne, a terminy dotrzymywane.", "problemy": "Procesy bywają sztywne i nie pasują do specyfiki działów, dlatego kierownicy traktują HR jak urząd i omijają go w ważnych sprawach.", "sygnal": "Procesy działają, ale kierownicy omijają HR i sami rozwiązują sprawy ludzi, a rotacja rośnie mimo sprawnej rekrutacji.", "krok": "Regularnie rozmawiać z dwoma kierownikami o problemach w ich zespołach i mierzyć jeden wskaźnik efektu, na przykład rotację w ich działach."}, "3": {"naz": "Partnerski", "jak": "HR wspiera kierowników, dopasowuje rozwiązania do potrzeb działów i opiera rozmowy na danych.", "mocne": "Kierownicy korzystają z HR, rozwiązania pasują do działów, a HR zna problemy zespołów.", "problemy": "HR dobrze działa w działach, ale nie wpływa na kierunek firmy i o decyzjach zarządu dowiaduje się po fakcie.", "sygnal": "HR działa dobrze, ale o decyzjach zarządu dowiaduje się po fakcie.", "krok": "Przygotować dla zarządu raport, który łączy dane o ludziach z wynikami firmy."}, "4": {"naz": "Strategiczny", "jak": "HR współtworzy strategię, planuje ludzi na kilka lat i prowadzi zmiany w całej organizacji, a niższe poziomy nadal działają.", "mocne": "Decyzje o ludziach zapadają razem z decyzjami biznesowymi, a organizacja ma ludzi, gdy realizuje swoje plany.", "problemy": "Gdy HR zajmuje się głównie strategią, obsługa i procesy mogą tracić jakość, a kierownicy mogą tracić bieżące wsparcie.", "sygnal": "Pojawiają się skargi na obsługę kadrową lub na procesy, mimo że HR uczestniczy w decyzjach zarządu.", "krok": "Raz w roku sprawdzać, czy podfunkcje na niższych poziomach nadal działają."}}, "komp": [{"p": 1, "n": "Stosowanie prawa pracy", "z": "Gdy przygotowuję dokument kadrowy, sprawdzam go z aktualnymi przepisami.", "c": "Chroni organizację i pracowników przed błędami prawnymi.", "r": "Przez miesiąc sprawdzaj każdy przygotowany dokument według listy kontrolnej przepisów, a wątpliwości omawiaj z doświadczoną osobą."}, {"p": 1, "n": "Dokumentacja kadrowo-płacowa", "z": "Prowadzę akta i ewidencję tak, że inna osoba odnajdzie każdy dokument.", "c": "Zapewnia, że każdy dokument można szybko odnaleźć i sprawdzić.", "r": "Uporządkuj jeden zbiór dokumentów według ustalonego wzoru i poproś kogoś, żeby odnalazł w nim trzy dokumenty."}, {"p": 1, "n": "System kadrowy i dane", "z": "Sprawdzam dane w systemie kadrowym, zanim posłużą do naliczenia płac.", "c": "Zapobiega błędom w płacach i w decyzjach opartych na danych.", "r": "Przed każdym naliczeniem płac porównuj zmiany w systemie z dokumentami źródłowymi."}, {"p": 1, "n": "Obsługa spraw pracowników", "z": "Gdy pracownik zgłasza sprawę, ustalam termin odpowiedzi i go dotrzymuję.", "c": "Buduje zaufanie pracowników do HR.", "r": "Przy każdej zgłoszonej sprawie zapisuj termin odpowiedzi i co tydzień sprawdzaj, czy go dotrzymałeś."}, {"p": 2, "n": "Prowadzenie procesów HR", "z": "Prowadzę rekrutację, wdrożenie czy ocenę według ustalonych etapów i pilnuję terminów.", "c": "Sprawia, że procesy przebiegają tak samo w całej firmie.", "r": "Opisz etapy jednego procesu, który prowadzisz, i przeprowadź według nich trzy najbliższe przypadki."}, {"p": 2, "n": "Planowanie projektów HR", "z": "Gdy przygotowuję projekt HR, ustalam zadania, osoby odpowiedzialne i terminy.", "c": "Pozwala zrealizować projekt HR w terminie i w budżecie.", "r": "Dla najbliższego projektu przygotuj harmonogram z zadaniami, osobami i terminami i przeglądaj go co tydzień."}, {"p": 2, "n": "Komunikacja z pracownikami", "z": "Gdy zmieniamy zasady, wyjaśniam pracownikom, co się zmienia i dlaczego.", "c": "Sprawia, że pracownicy rozumieją zmiany i rzadziej się im sprzeciwiają.", "r": "Przy najbliższej zmianie przygotuj krótkie wyjaśnienie: co się zmienia, dlaczego i co to oznacza dla pracownika. Sprawdź, czy zostało zrozumiane."}, {"p": 2, "n": "Współpraca z dostawcami usług HR", "z": "Gdy zlecam zadanie firmie zewnętrznej, ustalam mierniki jakości i je sprawdzam.", "c": "Pozwala kontrolować jakość usług kupowanych na zewnątrz.", "r": "Dla jednego dostawcy ustal trzy mierniki jakości i sprawdzaj je co miesiąc."}, {"p": 3, "n": "Rozpoznawanie potrzeb kierowników", "z": "Zanim zaproponuję rozwiązanie, ustalam, jaki problem w zespole kierownik chce rozwiązać.", "c": "Sprawia, że rozwiązania HR odpowiadają na rzeczywiste problemy działów.", "r": "Porozmawiaj z dwoma kierownikami o tym, jaki problem w zespole jest dla nich najważniejszy, zanim cokolwiek zaproponujesz."}, {"p": 3, "n": "Doradzanie kierownikom", "z": "Gdy kierownik ma trudną sprawę z pracownikiem, pomagam mu przygotować rozmowę.", "c": "Pozwala kierownikom samodzielnie i dobrze prowadzić trudne sprawy z ludźmi.", "r": "Przy najbliższej trudnej sprawie przygotuj z kierownikiem plan rozmowy, a po rozmowie omów z nim jej przebieg."}, {"p": 3, "n": "Analizowanie danych HR", "z": "Gdy rozmawiam z kierownikiem o rotacji, pokazuję mu dane z jego działu.", "c": "Pozwala opierać rozmowy z kierownikami na faktach.", "r": "Policz rotację i absencję w jednym dziale za ostatni rok i omów wyniki z jego kierownikiem."}, {"p": 3, "n": "Usprawnianie procesów HR", "z": "Gdy proces sprawia kłopot użytkownikom, zmieniam go i sprawdzam, czy jest prostszy.", "c": "Upraszcza pracę kierownikom i pracownikom.", "r": "Zapytaj pięciu użytkowników jednego procesu, co im przeszkadza, i usuń jeden zbędny krok."}, {"p": 4, "n": "Rozumienie biznesu", "z": "Potrafię wyjaśnić, na czym moja organizacja zarabia i co wpływa na jej wynik.", "c": "Pozwala łączyć działania HR z wynikami firmy.", "r": "Przeczyta   ${ws?`<li>${ws}</li>`:""}</ol></div>
 <div class="karta"><h2>Ograniczenia wyniku</h2><p>To samoocena jednej osoby, a nie pomiar. Organizację oceniasz z miejsca, w którym pracujesz. Własne kompetencje ludzie zwykle oceniają łagodniej niż obserwatorzy. Próg 3,5 i zasada 70% podfunkcji to przyjęte założenia. Wynik najlepiej traktować jako punkt wyjścia do rozmowy z przełożonym.</p></div>
